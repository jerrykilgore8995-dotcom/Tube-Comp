name: Fast Altec Plate-Feedback Audit
on:
  push:
    paths:
      - ".github/workflows/fast-spice-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
      - name: Measure 6CG7 bias and actual 6AL5 feedback effect
        run: |
          python3 - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from measure_compression_thd import measure
          root=Path(tempfile.mkdtemp(prefix="spice-audit-"))
          for mode in ("A-436B","RS124"):
              for dbu in (-24,-18,-12,-6,0):
                  c=dict(mode=mode,hz=1000,dbu=dbu,attack=0,recovery=0,
                         hold=False,input_knob=.8)
                  stem=mode.replace("-","")+str(dbu).replace("-","m")
                  on=measure(c,root/(stem+"on"),False)
                  off=measure(c,root/(stem+"off"),True)
                  print(f"{mode} {dbu:+} dBu: 6CG7 plate idle {on['plate_6cg7_a_V']:.2f} V; "
                        f"6BC8 plate idle {on['plate_6bc8_a_V']:.2f} V; "
                        f"CV {on['cv_V']:.2f} V; "
                        f"GR {off['output_dBu']-on['output_dBu']:.2f}dB; "
                        f"THD {on['thd_percent']:.3f}%; "
                        f"out {on['output_dBu']:.2f}dBu",flush=True)
          PY

      - name: Diagnose 436B rectifier bias against actual output compression
        run: |
          python3 - <<'PY'
          import sys,tempfile,subprocess
          from pathlib import Path
          import numpy as np
          sys.path.insert(0,"scripts")
          from run_lab import prepare,parse_wrdata,harmonics,OUTFIELDS
          root=Path(tempfile.mkdtemp(prefix="bias-probe-"))
          for threshold in (0,2.3,10,20):
              for dbu in (-18,-6):
                  c=dict(mode="A-436B",hz=1000,dbu=dbu,attack=0,recovery=0,
                         hold=False,input_knob=.8)
                  wd=root/f"TH{threshold}_L{dbu}"
                  deck=prepare(c,wd)
                  raw=deck.read_text()
                  key="VTHRESHOLD threshold 0 20"
                  assert key in raw
                  deck.write_text(raw.replace(key,f"VTHRESHOLD threshold 0 {threshold}"))
                  p=subprocess.run(["ngspice","-b",deck.name],cwd=wd,
                                   capture_output=True,text=True,timeout=60)
                  if p.returncode or not (wd/"tran.txt").exists():
                      print(f"threshold {threshold} dBu {dbu}: solver failed",flush=True)
                      continue
                  a=parse_wrdata(wd/"tran.txt",len(OUTFIELDS))
                  h=harmonics(a[:,0],a[:,1],1000)
                  cv=float(np.mean(a[-max(10,len(a)//10):,3]))
                  print(f"THRESHOLD {threshold:>4}V INPUT {dbu:>3}dBu: "
                        f"CV={cv:.2f}V, OUT={h['fundamental_output_dBu']:.2f}dBu, "
                        f"THD={h['THD_percent']:.3f}%",flush=True)
          PY
