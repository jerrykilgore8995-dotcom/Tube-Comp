name: TubeComp Output Transformer FR Fit
on:
  push:
    paths:
      - ".github/workflows/output-transformer-bandwidth-fit.yml"
      - "scripts/output_transformer_fit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transformer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
      - name: Fit differential transformer inductance and coupling to 436B response
        run: python3 scripts/output_transformer_fit.py
      - name: Upload output transformer phase frequency and inductance sweep
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-output-transformer-bandwidth-fit
          path: |
            output/output_transformer_fit/transformer_AC_fit.csv
            output/output_transformer_fit/top_transformer_fit.json
          if-no-files-found: error
