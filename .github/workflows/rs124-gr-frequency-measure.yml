name: RS124 exact GR 100Hz and 1kHz
on:
  push:
    branches: [rs124-stock-k7-cut]
    paths: ['.github/workflows/rs124-gr-frequency-measure.yml']
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/gr.cpp <<'CPP'
          #include "TubeCompDSP.h"
          #include <iostream>
          #include <complex>
          #include <iomanip>
          using namespace tubecomp;
          constexpr int fs=44100,N=8820;
          constexpr double tau=6.2831853071795864769;
          double measure(int hz,double db,bool report){
            Engine e;e.prepare(fs,256);Parameters p;p.rs124=true;p.input=10;e.setParameters(p,true);
            std::complex<double> h[21]={};double peak=std::pow(10.,db/20);
            for(int i=0;i<fs*8+N;++i){float l=float(peak*std::sin(tau*hz*i/fs)),r=l;e.process(l,r);if(report&&i>=fs*8)for(int k=1;k<=20;++k)h[k]+=double(l)*std::polar(1.,-tau*k*hz*i/fs);}
            double gr=e.meters().gainReduction;
            if(report){double sum=0;for(int k=2;k<=20;++k)sum+=std::norm(h[k]);std::cout<<std::setprecision(10)<<"RESULT "<<hz<<","<<db<<","<<gr<<","<<100*sqrt(sum)/abs(h[1]);for(int k=2;k<=20;++k)std::cout<<","<<20*log10(std::max(1.e-16,abs(h[k])/abs(h[1])));std::cout<<std::endl;}
            return gr;
          }
          int main(){for(int hz:{100,1000})for(double target:{5.,10.,20.,30.}){double lo=-70,hi=0;if(measure(hz,hi,false)<target||measure(hz,lo,false)>target){std::cout<<"UNREACHABLE "<<hz<<","<<target<<std::endl;continue;}for(int i=0;i<20;++i){double m=(lo+hi)/2;if(measure(hz,m,false)<target)lo=m;else hi=m;}measure(hz,(lo+hi)/2,true);}}
          CPP
          g++ -std=c++17 -O3 -Iplugin /tmp/gr.cpp -o /tmp/gr
          /tmp/gr | tee rs124-gr-thd.csv
      - uses: actions/upload-artifact@v4
        with:
          name: RS124-exact-GR-THD
          path: rs124-gr-thd.csv
