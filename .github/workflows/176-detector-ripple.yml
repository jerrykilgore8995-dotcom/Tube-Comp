    defaults:
      run:
        working-directory: research/176/mkii-wdf
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ngspice python3-numpy python3-scipy
      - name: Isolate CV ripple and compare attack topology
        run: /usr/bin/python3 detector-spice-audit.py ${{ matrix.f }} ${{ matrix.ratio }} ${{ matrix.attack }} ${{ matrix.release }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-${{ strategy.job-index }}
          path: |
            research/176/mkii-wdf/detector-spice-results.json
            research/176/mkii-wdf/spice-*.log
