name: 176 MK II transformer magnetics audit
on:
  push:
    branches: [176-mkii-magnetics]
    paths: ['.github/workflows/176-mkii-magnetics.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {"freq":20,"db":-18,"loss":0,"load":600,"enabled":1,"rate":176400,"ratio":4}
          - {"freq":20,"db":-18,"loss":20,"load":600,"enabled":1,"rate":176400,"ratio":4}
