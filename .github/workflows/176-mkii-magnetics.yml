          - {"freq":10000,"db":18,"loss":5,"load":600,"enabled":1,"rate":44100,"ratio":4}
          - {"freq":10000,"db":18,"loss":5,"load":600,"enabled":1,"rate":88200,"ratio":4}
          - {"freq":10000,"db":18,"loss":5,"load":600,"enabled":1,"rate":352800,"ratio":4}
