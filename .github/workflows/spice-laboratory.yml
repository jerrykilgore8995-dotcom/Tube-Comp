name: Circuit Simulation Laboratory
on:
  push:
    branches: [main]
    paths:
      - "spice/**"
      - "scripts/**"
      - "research/**"
      - ".github/workflows/spice-laboratory.yml"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Quick exploratory or broad study"
        type: choice
        required: true
        default: quick
        options: [quick, broad]
permissions:
  contents: read
jobs:
  ngspice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install actual SPICE solver and analysis software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy python3-matplotlib
      - name: Toolchain and model provenance
        run: |
          ngspice --version
          python3 --version
          sha256sum spice/models/tube_cells.lib
      - name: Run provisional circuit analysis and parameter study
        run: |
          if [ "${{ github.event.inputs.sweep }}" = "broad" ]; then
            python3 scripts/run_lab.py --broad --output output
          else
            python3 scripts/run_lab.py --quick --output output
          fi
      - name: Measure 1kHz compression and K2-K20 THD against detector-disabled reference
        run: python3 scripts/measure_compression_thd.py --output output/compression_thd
      - name: Rectified 6AL5 attack / recovery / HOLD time sweeps
        run: |
          if [ "${{ github.event.inputs.sweep }}" = "broad" ]; then
            python3 scripts/timing_lab.py --broad --out output/timing
          else
            python3 scripts/timing_lab.py --out output/timing
          fi
      - name: 6BC8 and 6CG7 nonlinear plate and transconductance curves
        run: python3 scripts/tube_curves.py --out output/tube_curves
      - name: 6BC8 grid-bias-conditioned AC phase, FR and group delay
        run: |
          if [ "${{ github.event.inputs.sweep }}" = "broad" ]; then
            python3 scripts/static_cv_ac.py --broad --output output/static_bias_ac
          else
            python3 scripts/static_cv_ac.py --output output/static_bias_ac
          fi
      - name: Compare real 6BC8 Sylvania candidate vs initial engineering model
        run: python3 scripts/compare_6bc8_models.py
      - name: Regression tests and historical calibration status
        run: python3 scripts/verify_results.py output
      - name: Upload compact summary of real measured numbers
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-SPICE-compact-measurements
          path: |
            output/manifest.json
            output/cases.json
            output/measurement_table.csv
            output/compression_thd/compression_thd_1khz.csv
            output/compression_thd/compression_thd_1khz.json
            output/compression_thd/summary.json
            output/transfer_1k.png
            output/thd_1k.png
            output/timing/timing.csv
            output/timing/timing.json
            output/tube_curves/plate_curves.csv
            output/tube_curves/transconductance.csv
            output/static_bias_ac/bias_operating_points.csv
            output/static_bias_ac/bias_operating_points.json
            output/static_bias_ac/frequency_phase_vs_control.csv
            output/6bc8_model_comparison/comparison.csv
            output/6bc8_model_comparison/comparison.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw ngspice results, harmonics and report
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-ngspice-exploratory-results
          path: output/
          if-no-files-found: error
          retention-days: 30
