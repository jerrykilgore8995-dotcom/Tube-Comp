name: Generate source-locked SPICE coefficient table
on:
  push:
    paths: [".github/workflows/generate-spice-coefficients.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get actual settled ngspice Altec reference
        uses: actions/download-artifact@v4
        with:
          run-id: 43270685026
          name: TubeComp-SPICE-parity-A-436B
          github-token: ${{ github.token }}
          path: golden/altec
      - name: Get actual settled ngspice RS124 reference
        uses: actions/download-artifact@v4
        with:
          run-id: 43270685026
          name: TubeComp-SPICE-parity-RS124
          github-token: ${{ github.token }}
          path: golden/rs124
      - name: Generate all K2 through K20 from real SPICE
        run: |
          python3 scripts/generate_spice_reference.py golden/altec/long_steady.csv \
            golden/rs124/long_steady.csv plugin/SpiceReferenceMeasured.inc
          grep 'source SHA256' plugin/SpiceReferenceMeasured.inc
      - name: Archive generated coefficient source
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-generated-1kHz-36point-K2-K20-SPICE-coefficients
          path: plugin/SpiceReferenceMeasured.inc
          if-no-files-found: error
      - name: Commit generated coefficients to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/SpiceReferenceMeasured.inc
          if git diff --cached --quiet; then
            echo "Coefficient table already current"
          else
            git commit -m "Generate validated 36-point 1kHz K2-K20 SPICE reference table"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
