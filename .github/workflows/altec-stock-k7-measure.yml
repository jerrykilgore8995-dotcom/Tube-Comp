name: Altec factory GR calibrated build and THD
on:
  push:
    branches: [altec-stock-k7-cut]
    paths: ['.github/workflows/altec-stock-k7-measure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/k7.cpp <<'CPP'
          #include "TubeCompDSP.h"
          #include <iostream>
          #include <complex>
          #include <iomanip>
          using namespace tubecomp;
          constexpr int fs=44100,N=8820;
          constexpr double tau=6.2831853071795864769;
          double measure(int knob,double db,bool report){
            Engine e;e.prepare(fs,256);Parameters p;p.rs124=false;p.input=float(knob);e.setParameters(p,true);
            std::complex<double> h[21]={};double peak=std::pow(10.,db/20);
            for(int i=0;i<fs*6+N;++i){float l=float(peak*std::sin(tau*1000*i/fs)),r=l;e.process(l,r);if(report&&i>=fs*6)for(int k=1;k<=20;++k)h[k]+=double(l)*std::polar(1.,-tau*k*1000*i/fs);}
            double gr=e.meters().gainReduction;
            if(report){double sum=0;for(int k=2;k<=20;++k)sum+=std::norm(h[k]);std::cout<<std::setprecision(10)<<"RESULT "<<knob*10<<","<<db<<","<<gr<<","<<100*sqrt(sum)/abs(h[1]);for(int k=2;k<=20;++k)std::cout<<","<<20*log10(std::max(1.e-16,abs(h[k])/abs(h[1])));std::cout<<std::endl;}
            return gr;
          }
          int main(){std::cout<<"input_percent,source_peak_dBFS,GR_dB,THD_percent";for(int k=2;k<=20;++k)std::cout<<",K"<<k<<"_dBc";std::cout<<std::endl;for(double db:{-40.,-22.,-18.,-4.,0.})for(int k=1;k<=10;++k)measure(k,db,true);for(double target:{25.,30.}){double lo=-40,hi=0;if(measure(10,hi,false)>=target){for(int i=0;i<18;++i){double m=(lo+hi)/2;if(measure(10,m,false)<target)lo=m;else hi=m;}measure(10,(lo+hi)/2,true);}}}
          CPP
          g++ -std=c++17 -O3 -Iplugin /tmp/k7.cpp -o /tmp/k7
          /tmp/k7 | tee stock-k7-thd.csv
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Altec-K7-THD
          path: stock-k7-thd.csv
  vst3:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 8 / VS2022
        run: cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
      - name: Build realtime DSP measurements and regressions
        run: cmake --build plugin/build --config Release --target TubeCompDSPTests --parallel 4
      - name: Verify nine attack, eleven recovery/HOLD, real compression, THD, harmonics, CPU
        run: ctest --test-dir plugin/build -C Release --output-on-failure
      - name: Compile Windows VST3 with real JUCE rack GUI
        run: cmake --build plugin/build --config Release --target TubeComp_VST3 --parallel 4
      - name: Package actual plugin folder
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path plugin/build -Recurse -Directory -Filter "Tube Comp RS124.vst3" |
            Select-Object -First 1
          if (-not $file) { throw "Compiled Tube Comp RS124.vst3 not found" }
          # Some JUCE 8 builds emit legacy trailing commas in VST3 moduleinfo.
          # Normalize to strict JSON without changing the compiled VST3 binary.
          $metadata = Join-Path $file.FullName "Contents/Resources/moduleinfo.json"
          if (Test-Path $metadata) {
            $raw = [System.IO.File]::ReadAllText($metadata)
            $normalized = [System.Text.RegularExpressions.Regex]::Replace($raw, ',(?=\s*[}\]])', '')
            $null = ConvertFrom-Json -InputObject $normalized -ErrorAction Stop
            [System.IO.File]::WriteAllText($metadata, $normalized)
          }
          Compress-Archive -LiteralPath $file.FullName -DestinationPath "TubeComp_Altec_K7_Calibrated_Windows_x64_VST3.zip" -Force
          $zip = Get-Item "TubeComp_Altec_K7_Calibrated_Windows_x64_VST3.zip"
          if ($zip.Length -lt 100000) { throw "VST3 archive suspiciously small" }
      - name: Upload working Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-Altec-K7-Calibrated-Windows-VST3
          path: TubeComp_Altec_K7_Calibrated_Windows_x64_VST3.zip
          if-no-files-found: error
