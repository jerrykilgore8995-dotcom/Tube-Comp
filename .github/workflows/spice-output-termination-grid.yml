name: SPICE Actual 200 and 600 Ohm Output Transformer Loads
on:
  push:
    paths:
      - ".github/workflows/spice-output-termination-grid.yml"
      - "scripts/output_termination_grid.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transformer-load:
    strategy:
      fail-fast: false
      matrix:
        mode: ["A-436B","RS124"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TUBECOMP_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Install physical ngspice and numpy solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
      - name: Measure true 200 and 600 ohm transformer loads inside feedback
        run: python3 scripts/output_termination_grid.py
      - name: Upload output-load frequency-independent drive and K2-K20 grid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-SPICE-loaded-output-${{ matrix.mode }}
          path: output/impedance_grid/${{ matrix.mode }}/load_grid.csv
          if-no-files-found: warn
