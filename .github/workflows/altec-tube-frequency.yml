name: Altec 436B tube-only 100 Hz 5 kHz 10 kHz spectra
on:
  push:
    branches: [436b-harmonic-audit]
    paths: ['.github/workflows/altec-tube-frequency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        hz: [100, 5000, 10000]
        level: [-18, -6, 7]
        knob: [0.8, 1.0]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ngspice python3-numpy python3-scipy
      - name: Measure K2 through K20 with tube mismatch only
        shell: bash
        run: |
          case "${{ matrix.hz }}" in
            100) step=0.5 ;;
            5000) step=0.125 ;;
            10000) step=0.0625 ;;
          esac
          /usr/bin/python3 scripts/altec_mismatch_audit.py --hz ${{ matrix.hz }} --caps 0 --mismatch 1 --level ${{ matrix.level }} --knob ${{ matrix.knob }} --step "$step"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tube-only-F${{ matrix.hz }}-L${{ matrix.level }}-I${{ matrix.knob }}
          path: |
            harmonics.csv
            audit/**/ngspice.log
            audit/**/case.cir
            audit/**/models/tube_cells.lib
          if-no-files-found: warn
