        run: node extended-wave.mjs ${{ matrix.rate }} ${{ matrix.ratio }} ${{ matrix.freq }} ${{ matrix.db }} ${{ matrix.mode }} ${{ matrix.attack }} ${{ matrix.release }} > wave.log 2>&1
