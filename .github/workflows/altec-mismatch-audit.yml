name: Altec 436B physical mismatch harmonic audit
on:
  push:
    branches: [436b-harmonic-audit]
    paths: ['scripts/altec_mismatch_audit.py', '.github/workflows/altec-mismatch-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        level: [-18, -6, 7]
        knob: [0.8, 1.0]
        step: [1, 0.5]
        mismatch: [0, 1]
      max-parallel: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ngspice python3-numpy python3-scipy
      - run: /usr/bin/python3 scripts/altec_mismatch_audit.py --level ${{ matrix.level }} --knob ${{ matrix.knob }} --step ${{ matrix.step }} --mismatch ${{ matrix.mismatch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmonic-L${{ matrix.level }}-I${{ matrix.knob }}-T${{ matrix.step }}-M${{ matrix.mismatch }}
          path: |
            harmonics.csv
            audit/**/ngspice.log
            audit/**/case.cir
            audit/**/models/tube_cells.lib
          if-no-files-found: warn
