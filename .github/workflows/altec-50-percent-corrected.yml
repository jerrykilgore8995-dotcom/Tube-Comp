name: Altec corrected 50 percent input
on:
  push:
    branches: [436b-harmonic-audit]
    paths: ['.github/workflows/altec-50-percent-corrected.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ngspice python3-numpy python3-scipy
      - run: /usr/bin/python3 scripts/altec_mismatch_audit.py --level -18 --knob 0.5 --step 0.5 --mismatch 1 --hz 1000
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-50-percent
          path: harmonics.csv
