name: Generate source-locked SPICE phase FIR
on:
  push:
    paths: [".github/workflows/generate-spice-phase-fir.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download measured SPICE AC phase and gain
        uses: actions/download-artifact@v4
        with:
          run-id: 43265955293
          name: TubeComp-30Hz-20kHz-frequency-phase-acceptance
          github-token: ${{ github.token }}
          path: golden/fr
      - name: Install numpy
        run: sudo apt-get update -qq && sudo apt-get install -y python3-numpy
      - name: Fit 73-tap measured complex transfer for 10 mode/CV states
        run: |
          python3 scripts/fit_spice_phase_fir.py \
             golden/fr/frequency_phase_all_points.csv plugin/SpicePhaseFIRMeasured.inc
      - name: Archive exact generated FIR coefficients
        uses: actions/upload-artifact@v4
        with:
          name: TubeComp-SPICE-73tap-10bias-phase-FIR
          path: plugin/SpicePhaseFIRMeasured.inc
          if-no-files-found: error
      - name: Commit generated source coefficient file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/SpicePhaseFIRMeasured.inc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate complex SPICE calibrated FIR for 10 bias/phase conditions"
          git pull --rebase origin main
          git push origin HEAD:main
